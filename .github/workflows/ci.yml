name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS: golden page maps were generated there, and its runners ship Chrome.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task build:web
      - run: deno task test
