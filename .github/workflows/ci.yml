name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS: golden page maps were generated there, and its runners ship Chrome.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      # build:site (not build:web): local-browser_test drives dist/, the
      # hosted site that every push to main deploys.
      - run: deno task build:site
      - run: deno task test
