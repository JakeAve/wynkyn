<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Book Editor</title>
    <link rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='1' width='12' height='14' rx='1.5' fill='%23f4efe4'/%3E%3Crect x='2' y='1' width='2' height='14' fill='%23161616'/%3E%3C/svg%3E">
    <script>
    // Resolve theme before first paint: explicit choice wins, else system.
    document.documentElement.dataset.theme = localStorage.theme ??
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <style>
    /* ---- Ink: one flat plane, hairlines and type carry the hierarchy ---- */
    :root {
      color-scheme: light;
      --bg: #fbfbfa; /* the single chrome surface */
      --desk: #f1f1ef; /* the desk the pages sit on */
      --line: #e7e7e4; /* hairlines */
      --soft: #f3f3f1; /* row separators inside lists */
      --hover: #efefec;
      --sel: #e4e4df; /* editor selection */
      --fg: #161616;
      /* Outlines drawn on the pages, which are paper-white in both themes:
         fixed dark ink, so dark mode does not override them. */
      --pick: rgba(22, 22, 22, 0.9);
      --hover-ring: rgba(22, 22, 22, 0.32);
      --hl: rgba(22, 22, 22, 0.07);
      --muted: #71716c;
      --inv-bg: #161616; /* inverted pill: active nav/segment */
      --inv-fg: #fbfbfa;
      --syn-k: #111111; /* {sentinel} names */
      --syn-c: #a3a39e; /* %% comments */
      --syn-t: #4c4c48; /* prose */
      --syn-p: #9c9c98; /* brackets, punctuation */
      --syn-slug: #7a6a4f;
      --syn-key: #556555;
      --ok: #4d7a4d;
      --warn: #8a6d3b;
      --err: #a04545;
      --page-shadow: 0 1px 2px rgba(0, 0, 0, .07), 0 8px 22px rgba(0, 0, 0, .09);
      --backdrop: rgba(0, 0, 0, .22);
      --radius: 6px;
      --fs: 13.5px;
      --fs-sm: 11px;
      /* Pane widths — dragged by the gutters, persisted in localStorage. */
      --w-tree: 230px;
      --w-editor: clamp(380px, 36%, 600px);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111111;
      --desk: #0a0a0a;
      --line: #262626;
      --soft: #1a1a1a;
      --hover: #1d1d1d;
      --sel: #2c2c2c;
      --fg: #ececea;
      --muted: #93938d;
      --inv-bg: #ececea;
      --inv-fg: #111111;
      --syn-k: #ececea;
      --syn-c: #6e6e6a;
      --syn-t: #b3b3af;
      --syn-p: #767672;
      --syn-slug: #c2ad83;
      --syn-key: #9db89d;
      --ok: #94b894;
      --warn: #c9a86a;
      --err: #d98a8a;
      --page-shadow: 0 2px 4px rgba(0, 0, 0, .5), 0 12px 30px rgba(0, 0, 0, .6);
      --backdrop: rgba(0, 0, 0, .55);
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
    }
    body {
      margin: 0;
      font: var(--fs)/1.45 system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
      display: grid;
      grid-template-rows: 46px minmax(0, 1fr) 30px;
      overflow: hidden;
    }
    button,
    select,
    input,
    textarea,
    summary {
      font: inherit;
      color: inherit;
    }
    :focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 1px;
    }
    .cm-editor.cm-focused {
      outline: none;
    }

    /* ---- shared control look: borderless ghosts ---- */
    .btn,
    #insert-menu summary,
    #config-overlay button {
      background: none;
      color: var(--muted);
      border: none;
      border-radius: var(--radius);
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover,
    #insert-menu summary:hover,
    #insert-menu[open] summary,
    #config-overlay button:hover {
      background: var(--hover);
      color: var(--fg);
    }
    .btn[aria-pressed="true"] {
      color: var(--fg);
    }
    .btn svg,
    .tico {
      display: block;
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .caption {
      color: var(--muted);
      text-transform: uppercase;
      font-size: var(--fs-sm);
      letter-spacing: .1em;
      font-weight: 600;
    }

    /* ---- toolbar ---- */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
    }
    #book-switcher,
    #edition-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      color: var(--fg);
    }
    #book-name {
      font-weight: 650;
      letter-spacing: -.01em;
      font-size: 14px;
    }
    #book-switcher .chev,
    #edition-switcher .chev {
      width: 12px;
      height: 12px;
      color: var(--muted);
    }
    #toolbar .spacer {
      flex: 1;
    }
    /* Segmented pane control: editor / split / preview */
    .seg {
      display: flex;
      gap: 2px;
    }
    .seg .btn[aria-pressed="true"] {
      background: var(--inv-bg);
      color: var(--inv-fg);
    }
    /* Theme toggle shows the icon for the mode it switches to */
    :root[data-theme="dark"] .icon-moon,
    :root[data-theme="light"] .icon-sun {
      display: none;
    }
    /* Insert menu: native <details> as a dropdown — no JS for open/close. */
    #insert-menu {
      position: relative;
    }
    #insert-menu summary {
      list-style: none;
    }
    #insert-menu summary::-webkit-details-marker {
      display: none;
    }
    #snippet-buttons {
      position: absolute;
      top: 100%;
      right: 0;
      z-index: 20;
      margin-top: 6px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 12px 32px var(--backdrop);
      display: flex;
      gap: 14px;
    }
    #snippet-buttons .group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 130px;
    }
    #snippet-buttons .group h4 {
      margin: 0 0 4px;
      padding: 0 6px;
      font-weight: 600;
    }
    #snippet-buttons button {
      background: none;
      color: var(--fg);
      border: none;
      border-radius: var(--radius);
      text-align: left;
      padding: 4px 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    #snippet-buttons button:hover {
      background: var(--hover);
    }
    #snippet-buttons kbd {
      float: right;
      margin-left: 16px;
      font-family: inherit;
      font-size: var(--fs-sm);
      color: var(--muted);
    }

    /* ---- book picker dialog ---- */
    #book-dialog {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
      width: 400px;
      max-width: 90vw;
      background: var(--bg);
      color: var(--fg);
      box-shadow: 0 14px 36px var(--backdrop);
    }
    #book-dialog::backdrop {
      background: var(--backdrop);
    }
    #book-search {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--line);
      background: none;
      padding: 12px 16px;
      outline-offset: -2px;
    }
    #book-search::placeholder {
      color: var(--muted);
    }
    #book-list {
      max-height: 50vh;
      overflow-y: auto;
      padding-bottom: 4px;
    }
    .book-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      width: 100%;
      padding: 11px 16px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--soft);
      cursor: pointer;
      text-align: left;
    }
    .book-row:hover {
      background: var(--hover);
    }
    .book-row[aria-current="true"] {
      background: var(--inv-bg);
      color: var(--inv-fg);
    }
    .book-row .book-num {
      font: var(--fs-sm) ui-monospace, Menlo, monospace;
      color: var(--muted);
      width: 18px;
      flex: none;
    }
    .book-row[aria-current="true"] .book-num,
    .book-row[aria-current="true"] .book-slug {
      color: inherit;
      opacity: .65;
    }
    .book-row .book-title {
      font-weight: 600;
      letter-spacing: -.01em;
    }
    /* ---- edition switcher ---- */
    #edition-switcher .edition-dot {
      color: var(--muted);
      margin-right: 2px;
    }
    #edition-name[data-unnamed] {
      color: var(--muted);
    }
    #edition-dialog {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
      width: 400px;
      max-width: 90vw;
      background: var(--bg);
      color: var(--fg);
      box-shadow: 0 14px 36px var(--backdrop);
    }
    #edition-dialog::backdrop {
      background: var(--backdrop);
    }
    #edition-list {
      max-height: 50vh;
      overflow-y: auto;
    }
    .edition-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: baseline;
      column-gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--soft);
      cursor: pointer;
    }
    .edition-row:hover {
      background: var(--hover);
    }
    .edition-row[aria-current="true"] {
      background: var(--inv-bg);
      color: var(--inv-fg);
    }
    .edition-row .edition-title {
      font-weight: 600;
    }
    .edition-row .edition-title[data-unnamed] {
      font-weight: 400;
      color: var(--muted);
    }
    .edition-row[aria-current="true"] .edition-title[data-unnamed],
    .edition-row[aria-current="true"] .edition-summary {
      color: inherit;
      opacity: .65;
    }
    .edition-row .edition-summary {
      grid-column: 1 / -1;
      font-size: var(--fs-sm);
      color: var(--muted);
    }
    .edition-row .edition-act {
      background: none;
      border: none;
      color: inherit;
      font-size: var(--fs-sm);
      opacity: .6;
      cursor: pointer;
      padding: 0 2px;
    }
    .edition-row .edition-act:hover {
      opacity: 1;
      text-decoration: underline;
    }
    .edition-foot {
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
    }
    .book-row .book-slug {
      margin-left: auto;
      font-size: var(--fs-sm);
      color: var(--muted);
    }
    .book-empty {
      padding: 14px 16px;
      color: var(--muted);
    }

    /* ---- footer ---- */
    #footer {
      color: var(--muted);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 14px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
    }
    #diagnostics {
      color: var(--warn);
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    #page-problems {
      display: flex;
      gap: 12px;
      overflow: hidden;
    }
    #page-problems button {
      font: inherit;
      color: var(--warn);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    #page-problems button:disabled {
      cursor: default;
    }
    #status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    #status[data-kind="saved"] {
      color: var(--ok);
    }
    #status[data-kind="saved"]::before {
      background: var(--ok);
    }
    #status[data-kind="error"],
    #status[data-kind="offline"] {
      color: var(--err);
    }
    #status[data-kind="error"]::before,
    #status[data-kind="offline"]::before {
      background: var(--err);
    }

    /* ---- panes ---- */
    /* One flat plane: panes share the chrome background; 5px gutters render a
       centred 1px hairline and are the drag handles. The preview is the hero:
       the editor holds a fixed reading measure, the preview takes the rest. */
    #panes {
      display: grid;
      grid-template-columns: var(--w-tree) 5px var(--w-editor) 5px minmax(0, 1fr);
      min-height: 0;
    }
    .gutter {
      cursor: col-resize;
      background: linear-gradient(var(--line), var(--line)) 50% 0 / 1px 100%
        no-repeat;
    }
    .gutter:hover,
    .gutter.dragging {
      background: linear-gradient(var(--muted), var(--muted)) 50% 0 / 3px 100%
        no-repeat;
    }
    /* Pane toggles: hide one of editor/preview and let the other fill the row.
       display:none removes the hidden pane from grid flow entirely, so the
       template only declares tracks for the visible panes. */
    #panes.pane-mode-editor,
    #panes.pane-mode-preview {
      grid-template-columns: var(--w-tree) 5px minmax(0, 1fr);
    }
    #panes.pane-mode-editor #preview,
    #panes.pane-mode-preview #editor,
    #panes.pane-mode-editor #gutter-editor,
    #panes.pane-mode-preview #gutter-editor {
      display: none;
    }
    /* Collapsible tree (toolbar toggle): drop the first two tracks. */
    #panes.tree-hidden {
      grid-template-columns: var(--w-editor) 5px minmax(0, 1fr);
    }
    #panes.tree-hidden.pane-mode-editor,
    #panes.tree-hidden.pane-mode-preview {
      grid-template-columns: minmax(0, 1fr);
    }
    #panes.tree-hidden #tree,
    #panes.tree-hidden #gutter-tree {
      display: none;
    }
    /* Config open: the panel takes the editor's slot so the preview is never
       covered while styling. app.ts forces split mode while it is open, so
       these rules only combine with .tree-hidden. */
    #panes.config-open #editor {
      display: none;
    }
    #tree {
      overflow-y: auto;
      padding: 8px 6px;
    }
    #tree ul.tree-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #tree button.tree-node {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-radius: var(--radius);
      color: inherit;
      padding: 5px 10px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #tree button.tree-node:hover {
      background: var(--hover);
    }
    #tree button.tree-node[aria-current="true"] {
      background: var(--inv-bg);
      color: var(--inv-fg);
    }
    #tree .tree-matter {
      color: var(--muted);
    }
    #tree button.tree-node[aria-current="true"].tree-matter {
      color: var(--inv-fg);
    }
    #tree .tree-part {
      font-weight: 600;
    }
    #editor {
      min-width: 0;
      overflow: hidden;
    }
    #editor .cm-editor {
      height: 100%;
    }
    #preview {
      background: var(--desk);
      overflow: auto;
      padding: 16px;
      position: relative;
    }
    /* A new render is staged invisibly beside the live pages and swapped in when
       complete, so the preview never flashes empty mid-render. */
    /* --preview-zoom: 1 is essential — Paged.js paginates by measuring rects,
       and a zoomed stage makes it fit twice as much text per page. */
    /* First load: nothing live yet, only the hidden stage — say so. */
    #preview:not(:has(> :not(.preview-stage)))::before {
      content: "Rendering pages…";
      color: var(--muted);
      display: block;
      text-align: center;
      padding-top: 40vh;
    }
    #preview .preview-stage {
      visibility: hidden;
      position: absolute;
      inset: 16px;
      --preview-zoom: 1;
    }
    /* Spread layout (spec §7.6): two book pages per row, page 1 recto-alone.
       --preview-zoom is set by fitPreview() so a full spread always fits the pane. */
    .pagedjs_pages {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0 8px;
      zoom: var(--preview-zoom, 1);
    }
    /* Pages are paper: ink black, never the chrome's text color — even in dark mode. */
    .pagedjs_page {
      background: #fffefc;
      color: #141210;
      box-shadow: var(--page-shadow);
      margin-bottom: 16px;
    }
    .pagedjs_pages .pagedjs_page:first-child {
      margin-left: calc(var(--pagedjs-width) + 8px);
    }

    /* ---- config panel: a pane in the editor's slot, never over the preview ---- */
    /* Header (.phead) stays put; only the tab body (.pbody) scrolls. */
    #config-overlay {
      min-width: 0;
      min-height: 0;
    }
    #config-overlay:not([hidden]) {
      display: flex;
      flex-direction: column;
    }
    /* Takes the slack between tabs and close; truncates in a narrow slot. */
    .cfg-saved {
      flex: 1;
      min-width: 0;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .cfg-saved[data-state="ok"] {
      color: var(--ok);
    }
    .cfg-saved[data-state="error"] {
      color: var(--err);
    }
    .cfg-field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
      /* so a full-width .cfg-error drops to its own line instead of
         squeezing the control it belongs to down to nothing */
      flex-wrap: wrap;
    }
    .cfg-label {
      width: 110px;
      flex: none;
      color: var(--muted);
    }
    .cfg-field input[type=text],
    .cfg-field select,
    .cfg-field textarea {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 4px 8px;
    }
    .cfg-row {
      display: flex;
      flex: 1;
      min-width: 0;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .cfg-error {
      color: var(--err);
      flex-basis: 100%;
    }
    .cfg-entry {
      border-top: 1px dashed var(--line);
      padding-top: 6px;
      margin-top: 6px;
    }
    /* Click-to-style: hovered, highlighted ("on N pages") and picked
       elements in the preview; the pick stays solid over the others */
    [data-style-hover],
    [data-style-hl] {
      outline: 1px solid var(--hover-ring);
      outline-offset: 3px;
    }
    [data-style-hl] {
      background: var(--hl);
    }
    [data-style-selected] {
      outline: 1px solid var(--pick);
      outline-offset: 3px;
    }
    .pagedjs_page .bml *,
    .pagedjs_margin-content {
      cursor: pointer;
    }
    /* ---- style panel controls (web/src/panel-controls.ts), scoped so they cannot collide ---- */
    #config-overlay svg.i {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }
    #config-overlay .phead {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 10px 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    #config-overlay .tabs {
      display: flex;
      gap: 2px;
      flex: none;
    }
    #config-overlay .tabs button {
      background: none;
      border: 0;
      border-radius: 999px;
      padding: 4px 11px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }
    #config-overlay .tabs button:hover {
      color: var(--fg);
      background: var(--hover);
    }
    #config-overlay .tabs button[aria-selected="true"] {
      background: var(--inv-bg);
      color: var(--inv-fg);
    }
    #config-overlay .pbody {
      overflow-y: auto;
      padding: 4px 16px 28px;
      flex: 1;
      min-height: 0;
      container-type: inline-size;
    }
    #config-overlay .sec {
      padding: 14px 0 12px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 4px;
      border-radius: 4px;
      transition: background-color .8s cubic-bezier(.16,1,.3,1);
    }
    #config-overlay .sec:last-child {
      border-bottom: 0;
    }
    #config-overlay .sec.flash {
      background: var(--hover);
      transition: none;
    }
    #config-overlay .sech {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 4px;
    }
    #config-overlay .sech h3 {
      margin: 0;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -.005em;
    }
    #config-overlay .where {
      background: none;
      border: 0;
      padding: 2px 6px;
      margin-right: -6px;
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    #config-overlay .where:hover {
      color: var(--fg);
      background: var(--hover);
    }
    #config-overlay .where svg.i {
      width: 13px;
      height: 13px;
    }
    #config-overlay .row {
      display: grid;
      grid-template-columns: 116px minmax(0,1fr);
      align-items: center;
      gap: 10px;
      min-height: 32px;
    }
    #config-overlay .row[hidden] {
      display: none;
    }
    #config-overlay .lbl {
      color: var(--muted);
      position: relative;
      padding-left: 11px;
    }
    #config-overlay .row.set .lbl {
      color: var(--fg);
    }
    #config-overlay .row.set .lbl::before {
      content: "";
      position: absolute;
      left: 0;
      top: .55em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--fg);
    }
    #config-overlay .ctl {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }
    #config-overlay .from {
      color: var(--muted);
      font-size: 12px;
    }
    #config-overlay .st {
      display: inline-flex;
      align-items: center;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
    }
    #config-overlay .st:focus-within {
      border-color: var(--muted);
    }
    #config-overlay .st button {
      background: none;
      border: 0;
      height: 100%;
      width: 26px;
      display: grid;
      place-items: center;
      color: var(--muted);
      cursor: pointer;
      border-radius: var(--radius);
    }
    #config-overlay .st button:hover {
      color: var(--fg);
      background: var(--hover);
    }
    #config-overlay .st input {
      width: 44px;
      border: 0;
      background: none;
      text-align: right;
      padding: 0 2px;
      font-variant-numeric: tabular-nums;
      outline: none;
    }
    #config-overlay .st input::placeholder {
      color: var(--muted);
      opacity: .75;
    }
    #config-overlay .st .u {
      color: var(--muted);
      font-size: 12px;
      padding: 0 4px 0 2px;
      min-width: 18px;
    }
    #config-overlay .seg {
      display: inline-flex;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 2px);
      flex-wrap: wrap;
    }
    #config-overlay .seg button {
      background: none;
      border: 0;
      border-radius: var(--radius);
      padding: 2px 9px;
      min-height: 22px;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    #config-overlay .seg button:hover {
      color: var(--fg);
      background: var(--hover);
    }
    #config-overlay .seg button[aria-checked="true"],
    #config-overlay .tog[aria-pressed="true"] {
      background: var(--inv-bg);
      color: var(--inv-fg);
    }
    #config-overlay .tog {
      background: none;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 2px 10px;
      min-height: 28px;
      color: var(--muted);
      cursor: pointer;
    }
    #config-overlay .tog:not([aria-pressed="true"]):hover {
      color: var(--fg);
    }
    #config-overlay .tog[aria-pressed="true"] {
      border-color: var(--inv-bg);
    }
    #config-overlay select.sel,
    #config-overlay input.txt {
      height: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      padding: 0 8px;
      min-width: 0;
      max-width: 100%;
    }
    #config-overlay select.sel {
      padding-right: 4px;
      cursor: pointer;
    }
    #config-overlay input.txt {
      width: 140px;
    }
    #config-overlay .fontpick {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    #config-overlay .fontpick select {
      flex: 1;
    }
    #config-overlay .spec {
      font-size: 22px;
      line-height: 1;
      width: 30px;
      text-align: center;
      color: var(--fg);
    }
    #config-overlay .sample {
      margin: 6px 0 2px 11px;
      font-size: 21px;
      line-height: 1.3;
      color: var(--fg);
      text-wrap: pretty;
    }
    #config-overlay .uses {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 6px;
      padding: 6px 0 2px 11px;
    }
    #config-overlay .uses .from {
      margin-right: 2px;
    }
    #config-overlay .chip {
      background: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 9px;
      font-size: 12px;
      color: var(--fg);
      cursor: pointer;
    }
    #config-overlay .chip:hover {
      background: var(--hover);
    }
    #config-overlay .range {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    #config-overlay .range input {
      flex: 1;
      min-width: 80px;
      accent-color: var(--fg);
    }
    #config-overlay .range output {
      font-variant-numeric: tabular-nums;
      min-width: 34px;
    }
    #config-overlay details.more {
      margin-top: 2px;
    }
    #config-overlay details.more summary {
      cursor: pointer;
      color: var(--muted);
      padding: 6px 0;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
    }
    #config-overlay details.more summary::-webkit-details-marker {
      display: none;
    }
    #config-overlay details.more summary:hover {
      color: var(--fg);
    }
    #config-overlay details.more summary svg {
      transition: transform .2s cubic-bezier(.16,1,.3,1);
    }
    #config-overlay details.more[open] summary svg {
      transform: rotate(90deg);
    }
    #config-overlay details.more textarea {
      width: 100%;
      min-height: 62px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      padding: 6px 8px;
      font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      resize: vertical;
    }
    #config-overlay .hint {
      color: var(--muted);
      font-size: 12px;
      margin: 2px 0 0;
    }
    #config-overlay .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
    }
    #config-overlay .crumb {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 0 6px;
      border-bottom: 1px solid var(--line);
    }
    #config-overlay .crumb .ghost {
      padding: 4px 6px 4px 2px;
      font-size: 13.5px;
    }
    #config-overlay .crumb strong {
      font-weight: 600;
    }
    #config-overlay .group {
      padding: 14px 0 4px;
    }
    #config-overlay .group h3 {
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }
    #config-overlay .part {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 8px;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--soft);
      padding: 8px 4px 8px 2px;
      cursor: pointer;
      text-align: left;
      color: var(--fg);
    }
    #config-overlay .part:hover {
      background: var(--hover);
    }
    #config-overlay .part .n {
      flex: 1;
    }
    #config-overlay .part .c {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    #config-overlay .part svg {
      color: var(--muted);
    }
    #config-overlay .tip {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    #config-overlay .mdiag {
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      grid-template-rows: auto auto auto;
      gap: 6px 8px;
      align-items: center;
      justify-items: center;
      padding: 6px 0 2px;
    }
    #config-overlay .mdiag .stage {
      grid-area: 2 / 2;
      display: flex;
      align-items: stretch;
    }
    #config-overlay .mpage {
      position: relative;
      height: 138px;
      background: var(--paper);
      border: 1px solid var(--line);
    }
    #config-overlay .mpage.v {
      opacity: .45;
      border-right: 0;
    }
    #config-overlay .mblock {
      position: absolute;
      background: repeating-linear-gradient(var(--hover) 0 3px, transparent 3px
        7px);
    }
    #config-overlay .mdiag .mt {
      grid-area: 1 / 2;
    }
    #config-overlay .mdiag .mb {
      grid-area: 3 / 2;
    }
    #config-overlay .mdiag .mi {
      grid-area: 2 / 1;
    }
    #config-overlay .mdiag .mo {
      grid-area: 2 / 3;
    }
    /* Narrow slot: the side steppers would overlap the drawing, so Inside and
       Outside move to a row of their own under it. */
    @container (max-width: 400px) {
      #config-overlay .mdiag {
        grid-template-columns: 1fr 1fr;
      }
      #config-overlay .mdiag .stage {
        grid-area: 2 / 1 / 3 / 3;
      }
      #config-overlay .mdiag .mt {
        grid-area: 1 / 1 / 2 / 3;
      }
      #config-overlay .mdiag .mb {
        grid-area: 3 / 1 / 4 / 3;
      }
      #config-overlay .mdiag .mi {
        grid-area: 4 / 1;
      }
      #config-overlay .mdiag .mo {
        grid-area: 4 / 2;
      }
    }
    #config-overlay .mlab {
      display: grid;
      justify-items: center;
      gap: 2px;
      font-size: 11.5px;
      color: var(--muted);
    }
    #config-overlay .readout {
      color: var(--muted);
      display: grid;
      gap: 4px;
      padding: 4px 0 0 11px;
    }
    #config-overlay .readout p {
      margin: 0;
    }
    #config-overlay .readout p:first-child {
      color: var(--fg);
    }
    #config-overlay .readout.cfg-readout-bad p {
      color: var(--err);
    }
    /* Print tab: the first signature as it prints. The sheet is paper-white in
       both themes. Solid strokes are screen pixels; the fold's dashes are in
       the SVG's units, inches, where its dash pattern is measured. */
    #config-overlay .sheets {
      display: grid;
      gap: 10px;
      padding: 6px 0 4px;
    }
    #config-overlay .sheet {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    #config-overlay .sheet figure {
      margin: 0;
      display: grid;
      gap: 3px;
      justify-items: center;
    }
    #config-overlay .sheet svg {
      width: 100%;
      height: auto;
      max-height: 150px;
    }
    #config-overlay .sheet figcaption {
      font-size: 11px;
      color: var(--muted);
    }
    #config-overlay .sheet .paper {
      fill: #fff;
      stroke: #b9b9b4;
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }
    #config-overlay .sheet .slot {
      fill: none;
      stroke: #e2e2de;
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }
    #config-overlay .sheet .slot.blank {
      fill: #ededea;
    }
    #config-overlay .sheet text {
      fill: #161616;
      text-anchor: middle;
      dominant-baseline: central;
      font-variant-numeric: tabular-nums;
    }
    #config-overlay .sheet .fold {
      stroke: #8f8f8a;
      stroke-width: .06;
      stroke-dasharray: .25 .18;
    }
    #config-overlay .sheet .cut {
      stroke: #a04545;
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }
    #config-overlay .actions {
      display: flex;
      gap: 8px;
      padding: 4px 0;
    }
    #config-overlay .tog.primary {
      background: var(--inv-bg);
      border-color: var(--inv-bg);
      color: var(--inv-fg);
    }
    #config-overlay .tog:disabled {
      opacity: .5;
      cursor: progress;
    }
    #config-overlay .export-status {
      display: grid;
      gap: 4px;
      padding-top: 6px;
      justify-items: start;
    }
    #config-overlay .export-status p {
      margin: 0;
    }
    #config-overlay .export-status .err,
    #config-overlay .export-status ul {
      color: var(--err);
    }
    #config-overlay .export-status ul {
      margin: 0;
      padding-left: 18px;
      font-size: 12px;
    }
    #config-overlay .files {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      padding: 4px 0;
    }
    #config-overlay .files a {
      color: var(--fg);
      text-underline-offset: 2px;
    }
    #config-overlay button,
    #config-overlay select,
    #config-overlay input,
    #config-overlay textarea {
      font: inherit;
    }
    #config-overlay .ghost {
      background: none;
      border: 0;
      border-radius: var(--radius);
      color: var(--muted);
      padding: 6px 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    #config-overlay .ghost:hover {
      background: var(--hover);
      color: var(--fg);
    }
    @media (prefers-reduced-motion: reduce) {
      #config-overlay * {
        transition: none !important;
      }
    }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="tree-toggle" class="btn" aria-pressed="true"
        title="Hide contents">
        <svg viewBox="0 0 16 16">
          <rect x="1.5" y="2.5" width="13" height="11" rx="1.2" />
          <line x1="5.5" y1="2.5" x2="5.5" y2="13.5" />
        </svg>
      </button>
      <button id="book-switcher" class="btn" title="Switch book">
        <span id="book-name"></span>
        <svg class="chev tico" viewBox="0 0 16 16">
          <path d="M4 6.5l4 4 4-4" />
        </svg>
      </button>
      <button id="edition-switcher" class="btn" title="Switch edition" hidden>
        <span class="edition-dot">·</span>
        <span id="edition-name"></span>
        <svg class="chev tico" viewBox="0 0 16 16">
          <path d="M4 6.5l4 4 4-4" />
        </svg>
      </button>
      <span class="spacer"></span>
      <details id="insert-menu">
        <summary>Insert</summary>
        <div id="snippet-buttons"></div>
      </details>
      <span id="pane-toggles" class="seg">
        <button id="pane-toggle-editor" class="btn" aria-pressed="false"
          title="Editor only">
          <svg viewBox="0 0 16 16">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.2" />
            <line x1="9.5" y1="2.5" x2="9.5" y2="13.5" opacity="0.4" />
          </svg>
        </button>
        <button id="pane-toggle-split" class="btn" aria-pressed="true"
          title="Split view">
          <svg viewBox="0 0 16 16">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.2" />
            <line x1="8" y1="2.5" x2="8" y2="13.5" />
          </svg>
        </button>
        <button id="pane-toggle-preview" class="btn" aria-pressed="false"
          title="Preview only">
          <svg viewBox="0 0 16 16">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.2" />
            <line x1="6.5" y1="2.5" x2="6.5" y2="13.5" opacity="0.4" />
          </svg>
        </button>
      </span>
      <button id="theme-toggle" class="btn" title="Switch light/dark">
        <svg class="icon-moon" viewBox="0 0 16 16">
          <path d="M13.2 9.4A5.6 5.6 0 0 1 6.6 2.8a5.6 5.6 0 1 0 6.6 6.6z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 16 16">
          <circle cx="8" cy="8" r="3" />
          <path
            d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" />
        </svg>
      </button>
      <button id="config-button" class="btn" title="Style"
        aria-label="Style panel">
        <svg viewBox="0 0 16 16">
          <path d="M2 4.5h6.2M11.8 4.5H14M2 11.5h2.2M7.8 11.5H14" />
          <circle cx="10" cy="4.5" r="1.8" />
          <circle cx="6" cy="11.5" r="1.8" />
        </svg>
      </button>
    </div>
    <div id="panes">
      <nav id="tree"></nav>
      <div id="gutter-tree" class="gutter" role="separator"
        aria-orientation="vertical" title="Drag to resize"></div>
      <div id="editor"></div>
      <div id="config-overlay" hidden></div>
      <div id="gutter-editor" class="gutter" role="separator"
        aria-orientation="vertical" title="Drag to resize"></div>
      <div id="preview"></div>
    </div>
    <div id="footer">
      <span id="page-indicator"></span>
      <span id="diagnostics"></span>
      <span id="page-problems"></span>
      <span id="status">Connecting…</span>
    </div>
    <dialog id="book-dialog">
      <input id="book-search" type="search" placeholder="Find a book…"
        autocomplete="off">
      <div id="book-list"></div>
    </dialog>
    <dialog id="edition-dialog">
      <div id="edition-list"></div>
      <div class="edition-foot">
        <button id="edition-new" class="btn">New edition</button>
      </div>
    </dialog>
    <script src="/vendor/paged.js"></script>
    <script type="module" src="/web/app.js"></script>
  </body>
</html>
