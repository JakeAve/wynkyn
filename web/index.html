<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='1' width='12' height='14' rx='1.5' fill='%23f4efe4'/%3E%3Crect x='2' y='1' width='2' height='14' fill='%234a5a78'/%3E%3C/svg%3E">
<style>
  /* ---- tokens: one palette, two type sizes ---- */
  :root {
    --bg-chrome: #23252a;   /* toolbar, footer */
    --bg-panel: #2b2d31;    /* tree, config panel, menus */
    --bg-control: #34363c;  /* buttons, inputs */
    --bg-hover: #3f424a;
    --bg-canvas: #52555a;   /* the desk the pages sit on */
    --border: #4a4d55;
    --fg: #e8e8e8;
    --fg-2: #cfd2d8;
    --fg-muted: #9aa0ab;
    --accent: #4a5a78;
    --accent-border: #5d7099;
    --accent-fg: #dfe6f0;
    --ok: #8fd18f;
    --warn: #f2b263;
    --err: #f08a8a;
    --radius: 4px;
    --fs: 14px;      /* everything readable */
    --fs-sm: 11px;   /* uppercase captions and chords only */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: var(--fs)/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg-canvas);
    display: grid; grid-template-rows: 40px minmax(0, 1fr) 24px; overflow: hidden;
  }
  button, select, input, textarea, summary { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent-border); outline-offset: 1px; }
  .cm-editor.cm-focused { outline: none; }

  /* ---- shared control look ---- */
  .btn, #toolbar select, #insert-menu summary, #config-overlay button {
    background: var(--bg-control); color: var(--fg-2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 2px 8px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover, #insert-menu summary:hover, #insert-menu[open] summary, #config-overlay button:hover { background: var(--bg-hover); }
  .caption {
    color: var(--fg-muted); text-transform: uppercase; font-size: var(--fs-sm);
    letter-spacing: .06em; font-weight: 600;
  }

  /* ---- toolbar ---- */
  #toolbar {
    background: var(--bg-chrome); display: flex; align-items: center; gap: 10px; padding: 0 12px;
  }
  #pane-toggles { display: flex; gap: 4px; }
  .pane-toggle { display: flex; align-items: center; padding: 3px; color: var(--fg-muted); }
  .pane-toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent-border); }
  .pane-toggle svg { display: block; width: 16px; height: 16px; }
  /* Insert menu: native <details> as a dropdown — no JS for open/close. */
  #insert-menu { position: relative; }
  #insert-menu summary { list-style: none; }
  #insert-menu summary::-webkit-details-marker { display: none; }
  #snippet-buttons {
    position: absolute; top: 100%; left: 0; z-index: 20; margin-top: 4px;
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .5); display: flex; gap: 12px;
  }
  #snippet-buttons .group { display: flex; flex-direction: column; gap: 2px; min-width: 120px; }
  #snippet-buttons .group h4 { margin: 0 0 4px; padding: 0 6px; }
  #snippet-buttons button {
    background: none; color: var(--fg); border: none; border-radius: var(--radius); text-align: left;
    padding: 3px 6px; cursor: pointer; white-space: nowrap;
  }
  #snippet-buttons button:hover { background: var(--bg-hover); }
  #snippet-buttons kbd { float: right; margin-left: 16px; font-family: inherit; font-size: var(--fs-sm); color: var(--fg-muted); }

  /* ---- footer ---- */
  #footer {
    background: var(--bg-chrome); color: var(--fg-muted);
    display: flex; align-items: center; gap: 16px; padding: 0 12px; white-space: nowrap; overflow: hidden;
  }
  #diagnostics { color: var(--warn); overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #status { margin-left: auto; color: var(--fg-2); }
  #status[data-kind="saved"] { color: var(--ok); }
  #status[data-kind="error"], #status[data-kind="offline"] { color: var(--err); }

  /* ---- panes ---- */
  /* The preview is the hero: the editor holds a fixed reading measure
     (~70 monospace chars), the preview takes every remaining pixel. */
  #panes { display: grid; grid-template-columns: 230px clamp(380px, 36%, 600px) minmax(0, 1fr); min-height: 0; }
  /* Pane toggles: hide one of editor/preview and let the other fill the row.
     The tree stays put — it's navigation, not part of what gets expanded.
     display:none removes the hidden pane from grid flow entirely, so only
     2 tracks are needed — declaring 3 (with one at 0) left the remaining
     item auto-placed into the zero-width middle track instead of the wide
     one, since the hidden item no longer consumes a cell to skip over. */
  #panes.pane-mode-editor, #panes.pane-mode-preview { grid-template-columns: 230px minmax(0, 1fr); }
  #panes.pane-mode-editor #preview { display: none; }
  #panes.pane-mode-preview #editor { display: none; }
  #tree { background: var(--bg-panel); overflow-y: auto; padding: 6px 0; }
  #tree ul.tree-list { list-style: none; margin: 0; padding: 0; }
  #tree button.tree-node {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: inherit; padding: 3px 8px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #tree button.tree-node:hover { background: var(--bg-hover); }
  #tree button.tree-node[aria-current="true"] { background: var(--accent); color: var(--accent-fg); }
  #tree .tree-matter { color: var(--fg-muted); }
  #tree .tree-part { font-weight: 600; }
  #editor { min-width: 0; overflow: hidden; }
  #editor .cm-editor { height: 100%; }
  #preview { overflow: auto; padding: 16px; position: relative; }
  /* A new render is staged invisibly beside the live pages and swapped in when
     complete, so the preview never flashes empty mid-render. */
  /* --preview-zoom: 1 is essential — Paged.js paginates by measuring rects,
     and a zoomed stage makes it fit twice as much text per page. */
  /* First load: nothing live yet, only the hidden stage — say so. */
  #preview:not(:has(> :not(.preview-stage)))::before {
    content: "Rendering pages…"; color: var(--fg); opacity: .7;
    display: block; text-align: center; padding-top: 40vh;
  }
  #preview .preview-stage { visibility: hidden; position: absolute; inset: 16px; --preview-zoom: 1; }
  /* Spread layout (spec §7.6): two book pages per row, page 1 recto-alone.
     --preview-zoom is set by fitPreview() so a full spread always fits the pane. */
  .pagedjs_pages { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 8px; zoom: var(--preview-zoom, 1); }
  /* Pages are paper: ink black, never the chrome's light text color. */
  .pagedjs_page { background: white; color: #111; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); margin-bottom: 16px; }
  .pagedjs_pages .pagedjs_page:first-child { margin-left: calc(var(--pagedjs-width) + 8px); }

  /* ---- config panel ---- */
  #config-overlay {
    position: fixed; top: 40px; right: 0; bottom: 24px; width: 400px;
    background: var(--bg-panel); overflow-y: auto; padding: 12px;
    box-shadow: -4px 0 12px rgba(0, 0, 0, .4); z-index: 10;
  }
  .cfg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cfg-saved { margin-left: auto; margin-right: 10px; color: var(--fg-muted); }
  .cfg-saved[data-state="ok"] { color: var(--ok); }
  .cfg-saved[data-state="error"] { color: var(--err); }
  .cfg-section { border-top: 1px solid var(--border); padding: 6px 0 8px; }
  .cfg-section summary { cursor: pointer; padding: 4px 0; user-select: none; color: var(--fg-2); }
  .cfg-section summary:hover { color: var(--fg); }
  .cfg-section[open] summary { margin-bottom: 4px; }
  .cfg-field { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .cfg-label { width: 110px; flex: none; color: var(--fg-muted); }
  .cfg-field input[type=text], .cfg-field select, .cfg-field textarea {
    flex: 1; min-width: 0; background: var(--bg-control); color: var(--fg);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 3px 6px;
  }
  .cfg-row { display: flex; flex: 1; min-width: 0; gap: 6px; align-items: center; flex-wrap: wrap; }
  .cfg-inline { display: inline-flex; align-items: center; gap: 3px; flex: none; color: var(--fg-muted); }
  .cfg-error { color: var(--err); flex-basis: 100%; }
  .cfg-entry { border-top: 1px dashed var(--border); padding-top: 6px; margin-top: 6px; }
</style>
</head>
<body>
<div id="toolbar">
  <select id="book-switcher"></select>
  <button id="config-button" class="btn" title="document configuration">⚙ configure</button>
  <span id="pane-toggles">
    <button id="pane-toggle-editor" class="btn pane-toggle" aria-pressed="false" title="Expand editor (hide preview)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.2"/>
        <line x1="8" y1="2.5" x2="8" y2="13.5"/>
        <rect x="9" y="3.5" width="4.5" height="9" fill="currentColor" opacity="0.4" stroke="none"/>
      </svg>
    </button>
    <button id="pane-toggle-preview" class="btn pane-toggle" aria-pressed="false" title="Expand preview (hide editor)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.2"/>
        <line x1="8" y1="2.5" x2="8" y2="13.5"/>
        <rect x="2.5" y="3.5" width="4.5" height="9" fill="currentColor" opacity="0.4" stroke="none"/>
      </svg>
    </button>
  </span>
  <details id="insert-menu">
    <summary>Insert ▾</summary>
    <div id="snippet-buttons"></div>
  </details>
</div>
<div id="panes">
  <nav id="tree"></nav>
  <div id="editor"></div>
  <div id="preview"></div>
</div>
<div id="footer">
  <span id="page-indicator"></span>
  <span id="diagnostics"></span>
  <span id="status">connecting…</span>
</div>
<div id="config-overlay" hidden></div>
<script src="https://unpkg.com/pagedjs@0.4.3/dist/paged.js"></script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
