<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='1' width='12' height='14' rx='1.5' fill='%23f4efe4'/%3E%3Crect x='2' y='1' width='2' height='14' fill='%234a5a78'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: system-ui, sans-serif; background: #52555a;
    display: grid; grid-template-rows: 40px minmax(0, 1fr) 24px; overflow: hidden;
  }
  #footer {
    background: #23252a; color: #9aa0ab; font-size: 12px;
    display: flex; align-items: center; gap: 16px; padding: 0 12px; white-space: nowrap; overflow: hidden;
  }
  #footer #status { margin-left: auto; color: #cfd2d8; }
  #footer #status[data-kind="saved"] { color: #8fd18f; }
  #footer #status[data-kind="error"], #footer #status[data-kind="offline"] { color: #f08a8a; }
  #footer #diagnostics { overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #snippet-buttons kbd {
    float: right; margin-left: 16px; font: 11px system-ui, sans-serif; color: #9aa0ab;
  }
  /* Insert menu: native <details> as a dropdown — no JS for open/close. */
  #insert-menu { position: relative; }
  #insert-menu summary {
    list-style: none; background: #34363c; color: #cfd2d8; border: 1px solid #4a4d55;
    border-radius: 4px; padding: 2px 7px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  #insert-menu summary::-webkit-details-marker { display: none; }
  #insert-menu summary:hover, #insert-menu[open] summary { background: #3f424a; }
  #snippet-buttons {
    position: absolute; top: 100%; left: 0; z-index: 20; margin-top: 4px;
    background: #2b2d31; border: 1px solid #4a4d55; border-radius: 6px; padding: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .5); display: flex; gap: 12px;
  }
  #snippet-buttons .group { display: flex; flex-direction: column; gap: 2px; min-width: 110px; }
  #snippet-buttons .group h4 {
    margin: 0 0 4px; padding: 0 6px; color: #9aa0ab; text-transform: uppercase;
    font-size: 11px; letter-spacing: .05em; font-weight: 600;
  }
  #toolbar {
    background: #23252a; color: #e8e8e8; font-size: 13px;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
  }
  #toolbar select {
    background: #34363c; color: #e8e8e8; border: 1px solid #4a4d55;
    border-radius: 4px; padding: 3px 6px; font-size: 13px;
  }
  #snippet-buttons button {
    background: none; color: #d8d8d8; border: none; border-radius: 4px; text-align: left;
    padding: 3px 6px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  #snippet-buttons button:hover { background: #3f424a; }
  #pane-toggles { display: flex; gap: 4px; }
  .pane-toggle {
    display: flex; align-items: center; background: #34363c; color: #9aa0ab;
    border: 1px solid #4a4d55; border-radius: 4px; padding: 3px; cursor: pointer;
  }
  .pane-toggle:hover { background: #3f424a; }
  .pane-toggle[aria-pressed="true"] { background: #4a5a78; color: #dfe6f0; border-color: #5d7099; }
  .pane-toggle svg { display: block; width: 16px; height: 16px; }
  #diagnostics { color: #f2b263; }
  #panes {
    display: grid; grid-template-columns: 230px minmax(0, 1fr) minmax(0, 1fr);
    min-height: 0;
  }
  /* Pane toggles: hide one of editor/preview and let the other fill the row.
     The tree stays put — it's navigation, not part of what gets expanded.
     display:none removes the hidden pane from grid flow entirely, so only
     2 tracks are needed — declaring 3 (with one at 0) left the remaining
     item auto-placed into the zero-width middle track instead of the wide
     one, since the hidden item no longer consumes a cell to skip over. */
  #panes.pane-mode-editor,
  #panes.pane-mode-preview {
    grid-template-columns: 230px minmax(0, 1fr);
  }
  #panes.pane-mode-editor #preview { display: none; }
  #panes.pane-mode-preview #editor { display: none; }
  #tree { background: #2b2d31; color: #d8d8d8; overflow-y: auto; padding: 6px 0; font-size: 13px; }
  #tree ul.tree-list { list-style: none; margin: 0; padding: 0; }
  #tree button.tree-node {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: inherit; font: inherit; padding: 3px 8px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #tree button.tree-node:hover { background: #3a3d44; }
  #tree button.tree-node[aria-current="true"] { background: #4a5a78; color: #dfe6f0; }
  #tree .tree-matter { color: #9aa0ab; }
  #tree .tree-part { font-weight: 600; }
  #editor { min-width: 0; overflow: hidden; }
  #editor .cm-editor { height: 100%; }
  #preview { overflow: auto; padding: 16px; }
  /* Spread layout (spec §7.6): two book pages per row, page 1 recto-alone. */
  /* --preview-zoom is set by fitPreview() so a full spread always fits the pane. */
  .pagedjs_pages { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 8px; zoom: var(--preview-zoom, 1); }
  .pagedjs_page { background: white; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); margin-bottom: 16px; }
  .pagedjs_pages .pagedjs_page:first-child { margin-left: calc(var(--pagedjs-width) + 8px); }
  #config-button {
    background: #34363c; color: #cfd2d8; border: 1px solid #4a4d55;
    border-radius: 4px; padding: 2px 7px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  #config-button:hover { background: #3f424a; }
  #config-overlay {
    position: fixed; top: 40px; right: 0; bottom: 0; width: 400px;
    background: #2b2d31; color: #d8d8d8; overflow-y: auto; padding: 12px;
    box-shadow: -4px 0 12px rgba(0, 0, 0, .4); font-size: 13px; z-index: 10;
  }
  .cfg-section { border-top: 1px solid #4a4d55; padding: 6px 0 8px; }
  .cfg-section summary {
    cursor: pointer; color: #cfd2d8; font-weight: 600; text-transform: uppercase;
    font-size: 11px; letter-spacing: .05em; padding: 4px 0; user-select: none;
  }
  .cfg-section summary:hover { color: #e8e8e8; }
  .cfg-section[open] summary { margin-bottom: 4px; }
  .cfg-saved { margin-left: auto; margin-right: 10px; font-size: 12px; color: #9aa0ab; }
  .cfg-saved[data-state="ok"] { color: #8fd18f; }
  .cfg-saved[data-state="error"] { color: #f08a8a; }
  #config-overlay button {
    background: #34363c; color: #cfd2d8; border: 1px solid #4a4d55;
    border-radius: 4px; padding: 2px 7px; cursor: pointer;
  }
  .cfg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cfg-head strong { font-size: 14px; }
  .cfg-field { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .cfg-label { width: 110px; flex: none; color: #9aa0ab; }
  .cfg-field input[type=text], .cfg-field select, .cfg-field textarea {
    flex: 1; min-width: 0; background: #34363c; color: #e8e8e8;
    border: 1px solid #4a4d55; border-radius: 4px; padding: 3px 6px; font: inherit;
  }
  .cfg-row { display: flex; flex: 1; min-width: 0; gap: 6px; align-items: center; flex-wrap: wrap; }
  .cfg-inline { display: inline-flex; align-items: center; gap: 3px; flex: none; color: #9aa0ab; }
  .cfg-error { color: #e77; font-size: 12px; flex-basis: 100%; }
  .cfg-entry { border-top: 1px dashed #4a4d55; padding-top: 6px; margin-top: 6px; }
</style>
</head>
<body>
<div id="toolbar">
  <select id="book-switcher"></select>
  <button id="config-button" title="document configuration">⚙ configure</button>
  <span id="pane-toggles">
    <button id="pane-toggle-editor" class="pane-toggle" aria-pressed="false" title="Expand editor (hide preview)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.2"/>
        <line x1="8" y1="2.5" x2="8" y2="13.5"/>
        <rect x="9" y="3.5" width="4.5" height="9" fill="currentColor" opacity="0.4" stroke="none"/>
      </svg>
    </button>
    <button id="pane-toggle-preview" class="pane-toggle" aria-pressed="false" title="Expand preview (hide editor)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.2"/>
        <line x1="8" y1="2.5" x2="8" y2="13.5"/>
        <rect x="2.5" y="3.5" width="4.5" height="9" fill="currentColor" opacity="0.4" stroke="none"/>
      </svg>
    </button>
  </span>
  <details id="insert-menu">
    <summary>Insert ▾</summary>
    <div id="snippet-buttons"></div>
  </details>
</div>
<div id="panes">
  <nav id="tree"></nav>
  <div id="editor"></div>
  <div id="preview"></div>
</div>
<div id="footer">
  <span id="diagnostics"></span>
  <span id="status">connecting…</span>
</div>
<div id="config-overlay" hidden></div>
<script src="https://unpkg.com/pagedjs@0.4.3/dist/paged.js"></script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
